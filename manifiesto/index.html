<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/imagenes/cola.png">
    <link rel="shortcut icon" href="/assets/imagenes/cola.png">
    <link rel="apple-touch-icon" href="/assets/imagenes/cola.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/estilo.css">
    <title>Manifiesto | Biblioteca Cuir</title>
</head>
<body class="manifiesto-pagina">
    <header class="sitio-cabecera" aria-label="Biblioteca Cuir">
        <a class="sitio-logo" href="/">
            <img src="/assets/logos/logo-biblio-negro.png" alt="Biblioteca Cuir">
        </a>
    </header>

    <!-- nav-principal:inicio -->
    <button class="portada-menu-interruptor propuesta-menu-interruptor" type="button" aria-expanded="false" aria-controls="manifest-menu">
        <span class="portada-menu-linea"></span>
        <span class="portada-menu-linea"></span>
        <span class="portada-menu-linea"></span>
        <span class="visualmente-solo">Abrir menú</span>
    </button>

    <nav class="portada-menu propuesta-menu" id="manifest-menu" aria-label="Menú principal">
        <a href="/manifiesto/" aria-current="page">manifiesto</a>
        <a href="/#sobre-nosotres">sobre nosotres</a>
        <a href="/coleccion/" data-compact-label="colección">coleccion</a>
        <a href="/portafolio/">portafolio</a>
        <a href="/dona/" data-compact-label="dona aquí">dona aqui</a>
        <a href="/#contacto">contacto</a>
    </nav>
    <!-- nav-principal:fin -->

    <main class="manifiesto-contenedor">
        <section class="manifiesto-principal" aria-label="Manifiesto visual Biblioteca Cuir">
            <div class="manifiesto-fragmentado-cuerpo" aria-label="Cuerpo fragmentado">
                <img class="manifiesto-cuerpo-capa" src="/assets/imagenes/cuerpo-fragmentado/1.png" alt="">
                <img class="manifiesto-cuerpo-capa" src="/assets/imagenes/cuerpo-fragmentado/2.png" alt="">
                <img class="manifiesto-cuerpo-capa" src="/assets/imagenes/cuerpo-fragmentado/3.png" alt="">

                <div class="manifiesto-punto manifiesto-punto-centro" aria-hidden="true">
                    <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/centro-02.png" alt="">
                    <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/centro-03.png" alt="">
                    <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/centro-01.png" alt="">
                </div>

                <div class="manifiesto-punto manifiesto-punto-patas" aria-hidden="true">
                    <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/patas-03.png" alt="">
                    <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/patas-02.png" alt="">
                    <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/patas-01.png" alt="">
                </div>

                <div class="manifiesto-lupa" aria-hidden="true">
                    <div class="manifiesto-lupa-ilustracion">
                        <img class="manifiesto-cuerpo-capa" src="/assets/imagenes/cuerpo-fragmentado/1.png" alt="">
                        <img class="manifiesto-cuerpo-capa" src="/assets/imagenes/cuerpo-fragmentado/2.png" alt="">
                        <img class="manifiesto-cuerpo-capa" src="/assets/imagenes/cuerpo-fragmentado/3.png" alt="">

                        <div class="manifiesto-punto manifiesto-punto-centro">
                            <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/centro-02.png" alt="">
                            <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/centro-03.png" alt="">
                            <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/centro-01.png" alt="">
                        </div>

                        <div class="manifiesto-punto manifiesto-punto-patas">
                            <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/patas-03.png" alt="">
                            <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/patas-02.png" alt="">
                            <img class="punto-fotograma" src="/assets/imagenes/cuerpo-fragmentado/patas-01.png" alt="">
                        </div>
                    </div>
                </div>

                <div class="manifiesto-cursor-punto" aria-hidden="true"></div>
            </div>
        </section>
    </main>

    <script src="/js/portfolio-proposals.js"></script>
    <script src="/js/manifiesto.js"></script>
    <script src="/js/site-motion.js" defer></script>
</body>
</html>
