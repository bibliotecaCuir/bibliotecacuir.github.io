name: Renovar nube de libros de la portada

on:
  push:
    branches: [main]
    paths:
      - "coleccion/yaml/**"
      - "coleccion/generar-libro-nube.js"
      - "coleccion/lib-catalogo.js"
      - "coleccion/nube-elegibles.json"
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Elegir 15 publicaciones al azar para index.html
        run: node generar-libro-nube.js
        working-directory: coleccion

      - name: Commitear index.html actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Renovar nube de libros de la portada automáticamente"
            git push
          fi
