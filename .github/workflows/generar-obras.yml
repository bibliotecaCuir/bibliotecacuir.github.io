name: Generar páginas de obras

on:
  push:
    branches: [main]
    paths:
      - "datos/obras.yaml"
      - "assets/portafolio/obras/**"
      - "scripts/generar-obras.js"
      - "scripts/lib/generar-portafolio.js"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar portafolio/obras/*.html desde datos/obras.yaml
        run: node scripts/generar-obras.js

      - name: Commitear páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portafolio/obras
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar páginas de obras automáticamente"
            git push
          fi
