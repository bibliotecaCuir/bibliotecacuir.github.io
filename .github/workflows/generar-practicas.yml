name: Generar páginas de prácticas

on:
  push:
    branches: [main]
    paths:
      - "datos/practicas.yaml"
      - "assets/portafolio/practicas/**"
      - "scripts/generar-practicas.js"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar portafolio/practicas/*.html desde datos/practicas.yaml
        run: node scripts/generar-practicas.js

      - name: Commitear páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portafolio/practicas
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar páginas de prácticas automáticamente"
            git push
          fi
