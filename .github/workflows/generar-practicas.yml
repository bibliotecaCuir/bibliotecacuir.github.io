name: Generar páginas de prácticas

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "datos/practicas.yaml"
      - "assets/portafolio/practicas/**"
      - "scripts/generar-practicas.js"
      - "scripts/lib/generar-portafolio.js"
      - "scripts/generar-drive-manifest.js"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Clonar portafolio-imagenes (para leer el listado de imagenes)
        uses: actions/checkout@v4
        with:
          repository: bibliotecaCuir/portafolio-imagenes
          path: ../portafolio-imagenes

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar portafolio/practicas/*.html desde datos/practicas.yaml
        run: node scripts/generar-practicas.js

      - name: Generar assets/portafolio/drive-manifest.json
        run: node scripts/generar-drive-manifest.js

      - name: Commitear páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portafolio/practicas assets/portafolio/drive-manifest.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar páginas de prácticas automáticamente"
            git push
          fi
