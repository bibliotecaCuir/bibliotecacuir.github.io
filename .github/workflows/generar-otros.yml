name: Generar páginas de otros

on:
  push:
    branches: [main]
    paths:
      - "datos/otros.yaml"
      - "assets/portafolio/otros/**"
      - "scripts/generar-otros.js"
      - "scripts/lib/generar-portafolio.js"
      - "scripts/generar-drive-manifest.js"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar portafolio/otros/*.html desde datos/otros.yaml
        run: node scripts/generar-otros.js

      - name: Generar assets/portafolio/drive-manifest.json
        run: node scripts/generar-drive-manifest.js

      - name: Commitear páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portafolio/otros assets/portafolio/drive-manifest.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar páginas de otros automáticamente"
            git push
          fi
