      profundidad: "No aplica"
      descripcion: "Conjunto de fotopostales de formato rectangular. Elaboradas en papel couché impreso a color. La cara principal presenta una reproducción fotográfica en orientación vertical, una persona en la parte central de la fotografia vestida de marino (polera a rayas de color azul marino y blanco, pantalón blanco y un gorro de marinero de azul marino y blanco) entre sus brazos sostiene un peluche de tiburón, la persona dirige su mirada al costado derecho, sobre su gorro se encuentra un navío de pequeñas dimensiones, el fondo de la fotografía es una imagen que muestra delfines saltando de las olas, en la parte inferior se encuentra un simbolo de marino de color azul. Mientras que el reverso contiene información textual impresa. Las piezas forman parte de una serie fotográfica titulada Conocí un viajero de tierra antigua."
      ubicacionPreferente: "Caja 02, Estante 01"
      ubicacionActual: "Caja 02"
      donante: "Desconocide"
      otros: "En la ficha de donacion se indica que son 2 copias, pero se encuentran algunas piezas perdidas"
      notasRegistro: "Cam Castro"
