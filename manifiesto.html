<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/estilo.css">
    <title>Manifiesto | Biblioteca Cuir</title>
</head>
<body class="manifest-page">
    <header class="site-header" aria-label="Biblioteca Cuir">
        <a class="site-logo" href="/">
            <img src="/assets/logos/logoBiblioNegro.png" alt="Biblioteca Cuir">
        </a>
    </header>

    <button class="landing-menu-toggle proposal-menu-toggle" type="button" aria-expanded="false" aria-controls="manifest-menu">
        <span class="landing-menu-line"></span>
        <span class="landing-menu-line"></span>
        <span class="landing-menu-line"></span>
        <span class="sr-only">Abrir menu</span>
    </button>

    <nav class="landing-menu proposal-menu" id="manifest-menu" aria-label="Menu principal">
        <a href="/#contacto">contacto</a>
        <a href="/manifiesto.html" aria-current="page">manifiesto</a>
        <a href="/#sobre-nosotres">sobre nosotres</a>
        <a href="/portafolio.html">portafolio</a>
        <a href="https://bibliotecacuir.github.io/coleccion/">coleccion</a>
    </nav>

    <main class="manifest-main">
        <section class="manifest-hero" aria-label="Manifiesto visual Biblioteca Cuir">
            <div class="manifest-fragmented-body" aria-label="Cuerpo fragmentado">
                <img class="manifest-body-layer" src="/assets/imagenes/cuerpo-fragmentado/1.png" alt="">
                <img class="manifest-body-layer" src="/assets/imagenes/cuerpo-fragmentado/2.png" alt="">
                <img class="manifest-body-layer" src="/assets/imagenes/cuerpo-fragmentado/3.png" alt="">

                <div class="manifest-hotspot manifest-hotspot-centro" aria-hidden="true">
                    <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/centro_02.png" alt="">
                    <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/centro_03.png" alt="">
                    <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/centro_01.png" alt="">
                </div>

                <div class="manifest-hotspot manifest-hotspot-patas" aria-hidden="true">
                    <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/patas_03.png.png" alt="">
                    <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/patas_02.png" alt="">
                    <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/patas_01.png" alt="">
                </div>

                <div class="manifest-loupe" aria-hidden="true">
                    <div class="manifest-loupe-art">
                        <img class="manifest-body-layer" src="/assets/imagenes/cuerpo-fragmentado/1.png" alt="">
                        <img class="manifest-body-layer" src="/assets/imagenes/cuerpo-fragmentado/2.png" alt="">
                        <img class="manifest-body-layer" src="/assets/imagenes/cuerpo-fragmentado/3.png" alt="">

                        <div class="manifest-hotspot manifest-hotspot-centro">
                            <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/centro_02.png" alt="">
                            <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/centro_03.png" alt="">
                            <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/centro_01.png" alt="">
                        </div>

                        <div class="manifest-hotspot manifest-hotspot-patas">
                            <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/patas_03.png.png" alt="">
                            <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/patas_02.png" alt="">
                            <img class="hotspot-frame" src="/assets/imagenes/cuerpo-fragmentado/patas_01.png" alt="">
                        </div>
                    </div>
                </div>

                <div class="manifest-cursor-dot" aria-hidden="true"></div>
            </div>
        </section>
    </main>

    <script src="/js/portfolio-proposals.js"></script>
    <script src="/js/manifiesto.js"></script>
    <script src="/js/site-motion.js" defer></script>
</body>
</html>
